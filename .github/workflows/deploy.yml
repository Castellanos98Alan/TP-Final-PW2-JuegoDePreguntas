name: Deploy to InfinityFree

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Crear config.ini de produccion
        run: |
          mkdir -p config
          echo "db_host = ${{ secrets.DB_HOST }}" > config/config.ini
          echo "db_user = ${{ secrets.DB_USER }}" >> config/config.ini
          echo "db_pass = ${{ secrets.DB_PASS }}" >> config/config.ini
          echo "db_name = ${{ secrets.DB_NAME }}" >> config/config.ini
          echo "db_port = 3306" >> config/config.ini
          echo "smtp_user = ${{ secrets.SMTP_USER || 'animequizsite@gmail.com' }}" >> config/config.ini
          echo "smtp_pass = ${{ secrets.SMTP_PASS || 'wzqyostxcvemsxqa' }}" >> config/config.ini

      - name: Desplegar por FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          echo "Iniciando deploy a InfinityFree..."
          lftp -e "
          set ftp:ssl-allow no;
          set ftp:passive-mode true;
          set net:timeout 30;
          set net:max-retries 15;
          set net:reconnect-interval-base 5;
          open -u $FTP_USER,$FTP_PASS $FTP_HOST;
          mirror -R --continue --verbose --parallel=1 --no-perms ./ htdocs/ --exclude-glob .git* --exclude-glob .github* --exclude-glob .gitignore;
          bye
          "